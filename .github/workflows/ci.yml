name: CI
on: [push, pull_request]
jobs:
  kontroller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: BOM yok
        run: bash scripts/ci/check-bom.sh
      - name: Tanımsız isim, sözdizimi, bulunamayan modül
        run: bash scripts/ci/check-names.sh src
      - name: Çeviri anahtarları (tr/en/de)
        run: node scripts/ci/i18n-parity.mjs messages scripts/ci/i18n-parity-ignore.json tr en de
      - name: JSON geçerli
        run: for f in messages/*.json package.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
# Derleme (next build) Vercel'de her push'ta ayrıca çalışıyor.
