name: CI
on: [push, pull_request]
jobs:
  kontroller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: BOM yok
        run: bash scripts/ci/check-bom.sh
      - name: Kök dizin haritası (STRUCTURE.md)
        run: node scripts/ci/check-root-map.mjs
      - name: Tanımsız isim, sözdizimi, bulunamayan modül
        run: bash scripts/ci/check-names.sh src
      - name: Çeviri anahtarları (tr/en/de)
        run: node scripts/ci/i18n-parity.mjs messages scripts/ci/i18n-parity-ignore.json tr en de
      - name: JSON geçerli
        run: for f in messages/*.json package.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: Bağımlılıklar (npm ci)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tip denetimi (tsc)
        run: npx tsc --noEmit -p .
      - name: ESLint çıtası (hata/uyarı sayısı tabanı aşamaz)
        run: node scripts/ci/eslint-ratchet.mjs scripts/ci/eslint-baseline.json src
# Derleme (next build) Vercel'de her push'ta ayrıca çalışıyor.
